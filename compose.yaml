services:
  mex-editor:
    build:
      context: .
    image: mex-editor:local
    ports:
      - 8000:8000
    environment:
      - MEX_BACKEND_API_KEY=write_key
      - MEX_BACKEND_API_URL=http://mex-backend:8080/
    depends_on:
      mex-backend:
        condition: service_healthy
  mex-backend:
    image: ghcr.io/robert-koch-institut/mex-backend:4.6.1@sha256:943de3865bb3dc39eb04ee9523ff7023d6df1ffafe3fdeac3d34fa7d5b9f3bb4
    ports:
      - 8080:8080
    environment:
      - MEX_BACKEND_HOST=0.0.0.0
      - MEX_GRAPH_URL=neo4j://neo4j:7687
      - MEX_IDENTITY_PROVIDER=graph
      - MEX_BACKEND_API_KEY_DATABASE={"write":["write_key"]}
      - MEX_BACKEND_API_USER_DATABASE={"write":{"admin":"admin"}}
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/v0/_system/check', timeout=3).raise_for_status()" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      neo4j:
        condition: service_healthy
  neo4j:
    image: neo4j:2026.09.0-community@sha256:6f3f17e72d69bb6f26b03f6186f5afb15a201f8b460bb69b0cd8030717f9f01a
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_dbms_usage__report_enabled=false
    ports:
      - 7687:7687
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
