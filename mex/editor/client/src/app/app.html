
<header>
  <div class="logo">
    <span class="bracket">[</span>ng<span class="bracket">]</span> MEx Projektmanager
  </div>
  <nav id="topNav">
    <a routerLink="/search" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Search</a>
    <a routerLink="/create" routerLinkActive="active">Create</a>
    <a routerLink="/edit" routerLinkActive="active">Edit</a>
  </nav>
  <div class="login-menu">
    @if (!isLoggedIn) {
     <button class="login-button" (click)="openLogin()">Login</button>
    } @else {
      <button class="login-button" (click)="logout()">Logout</button>
    }
  </div>
</header>

<div class="layout">
  <router-outlet></router-outlet>
</div>
