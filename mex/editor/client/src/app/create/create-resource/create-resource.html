<form [formRoot]="resourceForm">
  <div>LABEL: {{ resourceForm.accessRestriction | fieldMetadata: "labelKey" }}</div>

  <mex-field-errors
    /* [showErrorsWithoutTouch]="true" */
    [formField]="resourceForm.accessRestriction"
  ></mex-field-errors>

  @for (group of groups(); track group.groupName) {
    <h2 class="two-column-item">{{ group.groupName }}</h2>
    <div class="two-column-layout">
      @for (entry of group.fields; track entry.key) {
        <mex-fieldset [formField]="entry.field" [category]="entry.schema | fieldCategory">
          <mex-zod-field-editor
            class="one-column-item"
            [formField]="entry.field"
            [schema]="entry.schema"
          />
        </mex-fieldset>
      }
    </div>
  }
  <button type="submit">Submit</button>
</form>
