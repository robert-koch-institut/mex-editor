<form [formRoot]="resourceForm">
  @for (group of groups(); track group.groupName) {
    <h2 class="two-column-item">{{ group.groupName }}</h2>
    <div class="two-column-layout">
      @for (entry of group.fields; track entry.key) {
        <mex-fieldset
          #fieldset
          [labelKey]="`Resource.${entry.key}`"
          [descriptionKey]="`Resource.${entry.key}.description`"
          [category]="entry.schema | fieldCategory"
        >
          <mex-zod-field-editor
            class="one-column-item"
            [formField]="entry.field"
            [schema]="entry.schema"
          />
          <mex-field-error-summary
            [fieldState]="entry.field()"
            [fieldLabel]="fieldset.label()"
          ></mex-field-error-summary>
        </mex-fieldset>
      }
    </div>
  }
  <button type="submit">Submit</button>
</form>
