@for (entry of entries(); track entry.key) {
  <mex-fieldset
    [labelKey]="entry.key"
    [descriptionKey]="`${entry.key}.description`"
    [category]="entry.schema | fieldCategory"
  >
    <mex-zod-field-editor
      [formField]="$any(innerForm)[entry.key]"
      [schema]="entry.schema"
    ></mex-zod-field-editor>
  </mex-fieldset>
}
