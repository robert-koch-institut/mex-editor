<form (submit)="onSubmit()" [formRoot]="activityForm">
  <mat-form-field appearance="outline">
    <mat-label>Title</mat-label>
    <input matInput placeholder="Enter title" [formField]="activityForm.title" />
    @for (error of activityForm.title().errors(); track error) {
      <mat-error> {{ error.kind }} | {{ error.message }} </mat-error>
    }
  </mat-form-field>

  <button matButton="filled" type="submit">Submit</button>
</form>
