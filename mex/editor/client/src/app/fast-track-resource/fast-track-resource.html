<form (submit)="onSubmit($event)" [formRoot]="resourceForm">
  <mat-form-field appearance="outline">
    <mat-label>Title</mat-label>
    <input matInput placeholder="Enter title" [formField]="resourceForm.title" />
    @for (error of resourceForm.title().errors(); track error) {
      <mat-error> {{ error.kind }} | {{error.message}} </mat-error>
    }
  </mat-form-field>

  <button type="submit">Submit</button>
</form>
