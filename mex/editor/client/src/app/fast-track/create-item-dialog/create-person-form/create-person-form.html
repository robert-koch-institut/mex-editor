<form [formRoot]="personForm">
  <mex-fieldset
    labelKey="Person.givenName"
    [formField]="personForm.givenName"
    [showErrorWithoutTouch]="true"
  >
    <mat-form-field>
      <input matInput [formField]="personForm.givenName" class="focus-me" />
    </mat-form-field>
  </mex-fieldset>

  <mex-fieldset
    labelKey="Person.familyName"
    [formField]="personForm.familyName"
    [showErrorWithoutTouch]="true"
  >
    <mat-form-field>
      <input matInput [formField]="personForm.familyName" />
    </mat-form-field>
  </mex-fieldset>
</form>
