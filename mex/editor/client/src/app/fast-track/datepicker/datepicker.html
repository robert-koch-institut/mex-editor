<div class="mex-datepicker">
  <mat-form-field>
    <div class="input-container">
      <input
        matInput
        #dateInput
        [matDatepicker]="picker"
        [formField]="dateForm"
        [min]="minDate()"
        [max]="maxDate()"
        [disabled]="disabled()"
        [readonly]="readonly()"
        [errorStateMatcher]="customErrorMatcher"
        (blur)="touch.emit()"
        (dateInput)="onDateInput($event)"
        (input)="onDateInputChanged(dateInput.value)"
        [placeholder]="formats.parse.dateInput"
      />

      @if (mode() === "datetime") {
        <input
          matInput
          #timeInput
          type="time"
          [value]="time()"
          [disabled]="disabled()"
          [readonly]="readonly()"
          (input)="onTimeInput(timeInput.value)"
          (blur)="touch.emit()"
          (click)="$event.stopPropagation()"
        />
      }
    </div>

    @if (showPrecisionSelector()) {
      <ng-container matIconPrefix>
        <button
          type="button"
          matIconButton
          [matMenuTriggerFor]="menu"
          [disabled]="disabled() || readonly()"
        >
          <mat-icon [svgIcon]="'precision-' + mode()" />
        </button>

        <mat-menu #menu="matMenu">
          @for (option of allowed(); track option) {
            <button mat-menu-item (click)="onPrecisionChange(option)">
              <mat-icon [svgIcon]="'precision-' + option" />
              <span> {{ "datepicker.precision." + option | transloco }}</span>
            </button>
          }
        </mat-menu>
      </ng-container>
    }

    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker
      #picker
      [startView]="startView()"
      (yearSelected)="onYearSelected($event, picker)"
      (monthSelected)="onMonthSelected($event, picker)"
    />
    @if (hasParseError()) {
      <mat-hint class="error-hint">{{
        "datepicker.validation.parse" | transloco: { format: formats.parse.dateInput }
      }}</mat-hint>
    }
  </mat-form-field>
</div>
