<mat-form-field>
  <input
    matInput
    #dateInput
    [matDatepicker]="picker"
    [min]="minDate()"
    [max]="maxDate()"
    [disabled]="disabled()"
    [readonly]="readonly()"
    [formField]="dateForm"
    [errorStateMatcher]="customErrorMatcher"
    (input)="inputText.set(dateInput.value)"
    (blur)="touch.emit()"
    [placeholder]="dateFormats.parse.dateInput"
  />
  <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
  <mat-datepicker #picker />
</mat-form-field>
