<mat-form-field>
  <input
    matInput
    #dateInput
    [matDatepicker]="picker"
    [min]="minDate()"
    [max]="maxDate()"
    [formField]="dateForm"
    [errorStateMatcher]="customErrorMatcher"
    ()
    (blur)="touch.emit()"
    [placeholder]="dateFormats.parse.dateInput"
  />
  <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
  <mat-datepicker #picker />
  @if (customErrorMatcher.hasParseError()) {
    <mat-hint class="error-hint">{{
      "datepicker.validation.parse" | transloco: { format: dateFormats.parse.dateInput }
    }}</mat-hint>
  }
</mat-form-field>
