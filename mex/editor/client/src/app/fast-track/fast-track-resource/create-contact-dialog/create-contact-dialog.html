<h2 mat-dialog-title>Create new Person or Mail</h2>
<mat-dialog-content>
  <mat-tab-group
    [selectedIndex]="selectedTabIndex()"
    (selectedIndexChange)="selectedTabIndex.set($event)"
  >
    <mat-tab label="Person">
      <form [formRoot]="personForm">
        <mat-form-field>
          <mat-label>Firstname</mat-label>
          <input matInput placeholder="forename" [formField]="personForm.firstname" />
        </mat-form-field>

        <mat-form-field>
          <mat-label>Lastname</mat-label>
          <input matInput placeholder="lastname" [formField]="personForm.lastname" />
        </mat-form-field>
      </form>
    </mat-tab>
    <mat-tab label="Mail">
      <form [formRoot]="mailForm">
        <mat-form-field>
          <mat-label>Mail</mat-label>
          <input matInput placeholder="mail" [formField]="mailForm.email" />
        </mat-form-field>
      </form>
    </mat-tab>
  </mat-tab-group>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton [mat-dialog-close]>No thanks, abort</button>
  <button matButton [disabled]="!canClose()" [mat-dialog-close]="closeResult()">Create</button>
</mat-dialog-actions>
