@let state = formState();
<div class="label">
  @let label = labelKey() | transloco: labelParam() ?? {};
  {{ label }}
  @if (showCategoryLabel()) {
    <span class="category">- {{ categoryKey() | transloco }}</span>
  }
</div>
@let descKey = descriptionKey();
@if (descKey) {
  <div class="description">{{ descKey | transloco }}</div>
}

<ng-content></ng-content>

@if (state) {
  <mex-field-error-summary
    [fieldLabel]="label"
    [fieldState]="state"
    [showErrorsWithoutTouch]="showErrorWithoutTouch()"
    [showNestedErrors]="true"
  >
  </mex-field-error-summary>
}
