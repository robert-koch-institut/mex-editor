<div class="link-editor" role="group" [attr.aria-invalid]="invalid()" *transloco="let t">
  <mat-form-field class="url">
    <mat-label>{{ t("link-editor.link.url") }}</mat-label>
    <input matInput type="url" [formField]="linkForm.url" (blur)="touch.emit()" />
    @for (error of linkForm.url().errors(); track $index) {
      <mat-error class="fix-spacing">
        <mex-field-error [error]="error" [fieldLabel]="t('link-editor.link.url')"></mex-field-error>
      </mat-error>
    }
  </mat-form-field>

  <mat-form-field class="title">
    <mat-label>{{ t("link-editor.link.title") }}</mat-label>
    <input matInput [formField]="linkForm.title" (blur)="touch.emit()" />
    <mex-link-language-menu
      matSuffix
      [language]="asLinkLanguage(linkForm.language().value())"
      (languageSelected)="linkForm.language().value.set($event)"
    ></mex-link-language-menu>

    @for (error of linkForm.title().errors(); track $index) {
      <mat-error class="fix-spacing">
        <mex-field-error
          [error]="error"
          [fieldLabel]="t('link-editor.link.title')"
        ></mex-field-error>
      </mat-error>
    }
    @for (error of linkForm.language().errors(); track $index) {
      <mat-error class="fix-spacing">
        <mex-field-error
          [error]="error"
          [fieldLabel]="t('link-editor.link.language')"
        ></mex-field-error>
      </mat-error>
    }
  </mat-form-field>
</div>
