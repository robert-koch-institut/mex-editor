<button
  type="button"
  matIconButton
  class="menu-trigger"
  [matMenuTriggerFor]="menu"
  [disabled]="disabled()"
>
  {{ language() ?? "-" }}
</button>

<mat-menu #menu="matMenu">
  @for (option of options(); track option.value) {
    <button type="button" mat-menu-item (click)="onLanguageSelected(option.value)">
      {{ option.labelKey | transloco }}
    </button>
  }
</mat-menu>
