<mat-button-toggle-group
  [value]="currentLanguage$ | async"
  (change)="changeLanguage($event.value)"
  [hideSingleSelectionIndicator]="true"
>
  @for (lang of availableLanguages; track lang.id) {
    <mat-button-toggle [value]="lang.id">{{ lang.label }}</mat-button-toggle>
  }
</mat-button-toggle-group>
