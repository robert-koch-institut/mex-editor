<mat-toolbar class="nav-bar" *transloco="let t">
  <a routerLink="" class="brand" title="MEx - Metadata Exchange">
    <img src="mex-logo.svg" alt="Logo MEx - Metadata Exchange" />
  </a>
  <div class="nav-bar-links">
    <a class="link" routerLink="/create/resource" routerLinkActive="active">
      {{ t("Resource") }}
      <div class="active-indicator"></div>
    </a>
    <a class="link" routerLink="/create/activity" routerLinkActive="active">
      {{ t("Activity") }}
      <div class="active-indicator"></div>
    </a>
  </div>
  <span style="flex: 1 1 auto"></span>
  <div class="nav-bar-controls">
    <mex-language-selector></mex-language-selector>
    <span class="nav-bar-user">username@rki.de</span>
    <button class="nav-bar-logout" type="button" aria-label="Logout">
      {{ t("Logout") }}
      <mat-icon aria-hidden="true">arrow_forward</mat-icon>
    </button>
  </div>
</mat-toolbar>
