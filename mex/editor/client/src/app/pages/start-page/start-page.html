<section>
  <h1>{{ title() }}</h1>
</section>
<h3>Language is {{language()}}</h3>
<section class="spaced">
  <button matButton="filled" routerLink="/create/resource">Create new datasource / dataset</button>
  <button matButton="filled" routerLink="/create/activity">Create new project</button>
</section>

<section>
  @let data = data$ | async;
  <h2>Backend Items ({{ data?.total ?? 0 }})</h2>
  <ul>
    @for (item of data?.items; track item.identifier) {
      <li>
        <b>{{ item.$type }}</b>: {{ item.identifier }}
      </li>
    } @empty {
      <li>There are no items.</li>
    }
  </ul>
</section>
