@let field = formField();
@let state = field();
@if (state.invalid() && (showErrorsWithoutTouch() || state.touched())) {
  @let errors = state.errors();
  @if (errors && errors.length > 0) {
    @let label = field | fieldMetadata: "labelKey" | transloco;
    <div class="error-container">
      @for (error of errors; track $index) {
        <mex-field-error
          [error]="error"
          [fieldLabel]="label ?? fieldLabel() ?? ''"
        ></mex-field-error>
      }
    </div>
  }
}
