<div class="text-editor" role="group" [attr.aria-invalid]="invalid()" *transloco="let t">
  <mat-form-field class="title">
    <mat-label>{{ t("Text.value") }}</mat-label>
    <input matInput [formField]="textForm.value" (blur)="touch.emit()" />
    <mex-text-language-menu
      matSuffix
      [language]="asTextLanguage(textForm.language().value())"
      [nullable]="true"
      (languageSelected)="this.textForm.language().value.set($event ?? '')"
    ></mex-text-language-menu>
  </mat-form-field>
  <mex-field-errors [formField]="textForm.value" [fieldLabel]="t('Text.value')"></mex-field-errors>
  <mex-field-errors
    [formField]="textForm.language"
    [fieldLabel]="t('Text.language')"
  ></mex-field-errors>
</div>
