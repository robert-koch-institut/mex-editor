@for (entry of entries(); track entry.key) {
  <mex-fieldset
    [formField]="entry.field"
    [labelKey]="entry.key"
    [descriptionKey]="`${entry.key}.description`"
    [category]="entry.schema | fieldCategory"
  >
    <mex-zod-field-editor [formField]="entry.field" [schema]="entry.schema" />
  </mex-fieldset>
}
