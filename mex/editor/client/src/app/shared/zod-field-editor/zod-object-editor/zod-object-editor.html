@for (entry of entries(); track entry.key) {
  <mex-fieldset
    [labelKey]="entry.key"
    [descriptionKey]="`${entry.key}.description`"
    [category]="entry.schema | fieldCategory"
  >
    @if (innerForm[entry.key]; as field) {
      <mex-zod-field-editor [formField]="field" [schema]="entry.schema" />
    }
  </mex-fieldset>
}
